    <!-- Swirl Center Core -->
    <path d="M960,540 C985,540 1010,515 1010,490 C1010,450 970,420 930,420 C870,420 810,470 810,530 C810,610 880,680 960,680 C1070,680 1160,590 1160,480 C1160,340 1030,220 890,220"
          fill="none" stroke="#364E2E" stroke-width="55" stroke-linecap="round" stroke-linejoin="round" />
  </g>

