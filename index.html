<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remix Starlit Letters_v2</title>
    <meta name="description" content="A production-grade React application for Starlit Letters." />
    <meta property="og:title" content="Remix Starlit Letters_v2" />
    <meta property="og:description" content="A production-grade React application for Starlit Letters." />
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        function isIgnorable(err) {
          if (!err) return false;
          var msg = (typeof err === 'string')
            ? err
            : ((err.message || '') + ' ' + (err.reason && err.reason.message ? err.reason.message : '') + ' ' + (err.reason || '') + ' ' + (err.name || '') + ' ' + (err.code || '') + ' ' + String(err));
          var lower = msg.toLowerCase();
          return (
            lower.includes('database is closing') ||
            lower.includes('database connection is closing') ||
            lower.includes('closing/hidden') ||
            lower.includes('the database is closed') ||
            lower.includes('client is offline') ||
            lower.includes('document hidden') ||
            (lower.includes('indexeddb') && (lower.includes('closing') || lower.includes('hidden') || lower.includes('abort') || lower.includes('closed') || lower.includes('invalidstate'))) ||
            (lower.includes('database') && (lower.includes('closing') || lower.includes('closed') || lower.includes('hidden')))
          );
        }
        window.addEventListener('error', function(event) {
          if (isIgnorable(event.error) || isIgnorable(event.message) || isIgnorable(event)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnorable(event.reason) || isIgnorable(event.reason && event.reason.message) || isIgnorable(event)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
